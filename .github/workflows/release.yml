name: Release

# Publishes the release that VERSION names, from one click or one API call:
# tags the commit this is run on, creates the GitHub release with
# docs/RELEASE-<version>.md as its notes, then starts the Image workflow on
# the tag so the GHCR images are built and published. It exists because a tag
# pushed from a cloud session is refused and `gh release create` on a
# developer machine needs a permission prompt; a workflow needs neither.
#
# Run it from the Actions tab (Run workflow, branch main), or with
# `gh workflow run release.yml --ref main`. It publishes nothing unless
# VERSION, docs/RELEASE-<version>.md and the tag all agree, and it refuses to
# touch a version that is already tagged, except to rewrite that release's
# notes when started with refresh_notes (the tag and the images stay put), or
# to move the tag to the commit it is run on when started with move_tag (the
# release is deleted and made again, and the images are rebuilt: use it only
# for a release whose tag was cut from the wrong commit), or, started with
# repoint_tag and repoint_sha, to point an existing tag at another commit of
# main without a rebuild (after the history was rewritten), or, started with
# notes_version, to rewrite the notes of an existing release. One mode per run.
on:
  workflow_dispatch:
    inputs:
      refresh_notes:
        description: Rewrite the notes of the release VERSION names, which must already exist
        type: boolean
        default: false
      repoint_tag:
        description: Only point this existing tag (say v2.6.3) at repoint_sha, forced; no release, no build
        type: string
        default: ""
      repoint_sha:
        description: The full commit id repoint_tag should point at; it must be on main
        type: string
        default: ""
      notes_version:
        description: Only rewrite the notes of this existing release (say 2.6.3) from docs/RELEASE-<version>.md on main
        type: string
        default: ""
      move_tag:
        description: Delete the release and tag VERSION names and publish them again from this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release, build images
    runs-on: ubuntu-latest
    # Public repository only, like image.yml's Publish step: the private
    # repository never tags or publishes.
    if: github.repository == 'danionita/arguesecure-onlinev2' && github.ref == 'refs/heads/main' && inputs.repoint_tag == '' && inputs.notes_version == ''
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version, the notes and the tag agree
        id: v
        env:
          REFRESH: ${{ inputs.refresh_notes }}
          MOVE: ${{ inputs.move_tag }}
          REPOINT_SHA: ${{ inputs.repoint_sha }}
        run: |
          [ -z "$REPOINT_SHA" ] || { echo "repoint_sha needs repoint_tag" >&2; exit 1; }
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "VERSION '$version' is not x.y.z" >&2; exit 1; }
          [ -f "docs/RELEASE-$version.md" ] || { echo "docs/RELEASE-$version.md is missing" >&2; exit 1; }
          tagged=false
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && tagged=true
          if [ "$REFRESH" = true ] && [ "$MOVE" = true ]; then
            echo "refresh_notes and move_tag are separate runs" >&2; exit 1
          fi
          if [ "$tagged" = true ] && [ "$REFRESH" != true ] && [ "$MOVE" != true ]; then
            echo "v$version is already tagged" >&2; exit 1
          fi
          if [ "$tagged" = false ] && { [ "$REFRESH" = true ] || [ "$MOVE" = true ]; }; then
            echo "v$version is not tagged, so there is nothing to refresh or move" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "refresh=$REFRESH" >> "$GITHUB_OUTPUT"
          echo "move=$MOVE" >> "$GITHUB_OUTPUT"

      - name: Rewrite the notes of the existing release
        if: steps.v.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release edit "v$VERSION" --notes-file "docs/RELEASE-$VERSION.md"

      - name: Remove the old release and tag
        if: steps.v.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh release delete "v$VERSION" --cleanup-tag --yes

      - name: Create the tag and the release
        if: steps.v.outputs.refresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "ArgueSecure $VERSION" \
            --notes-file "docs/RELEASE-$VERSION.md"

      - name: Build and publish the images
        if: steps.v.outputs.refresh != 'true'
        # A tag created with the workflow token does not start other
        # workflows, so start Image on the tag by hand.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: gh workflow run image.yml --ref "v$VERSION"

  repoint:
    name: Point an existing tag at another commit
    # For after the public history is rewritten: the tag keeps its release,
    # its images are not rebuilt, and nothing is published.
    if: github.repository == 'danionita/arguesecure-onlinev2' && github.ref == 'refs/heads/main' && inputs.repoint_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.repoint_tag }}
          SHA: ${{ inputs.repoint_sha }}
          NOTES: ${{ inputs.notes_version }}
          REFRESH: ${{ inputs.refresh_notes }}
          MOVE: ${{ inputs.move_tag }}
        run: |
          [ -z "$NOTES" ] && [ "$REFRESH" != true ] && [ "$MOVE" != true ] || { echo "one mode per run" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "'$TAG' is not vX.Y.Z" >&2; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "repoint_sha must be a full commit id" >&2; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main" >&2; exit 1; }
          [ "$(git show "$SHA:VERSION" | tr -d '[:space:]')" = "${TAG#v}" ] || { echo "VERSION at $SHA is not ${TAG#v}" >&2; exit 1; }
          echo "$TAG: $(git rev-parse "refs/tags/$TAG^{commit}") -> $SHA"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$SHA" -F force=true

  notes:
    name: Rewrite the notes of an existing release
    if: github.repository == 'danionita/arguesecure-onlinev2' && github.ref == 'refs/heads/main' && inputs.notes_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Edit the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.notes_version }}
          REPOINT_TAG: ${{ inputs.repoint_tag }}
          REFRESH: ${{ inputs.refresh_notes }}
          MOVE: ${{ inputs.move_tag }}
        run: |
          [ -z "$REPOINT_TAG" ] && [ "$REFRESH" != true ] && [ "$MOVE" != true ] || { echo "one mode per run" >&2; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "'$VERSION' is not x.y.z" >&2; exit 1; }
          [ -f "docs/RELEASE-$VERSION.md" ] || { echo "docs/RELEASE-$VERSION.md is missing" >&2; exit 1; }
          gh release edit "v$VERSION" --notes-file "docs/RELEASE-$VERSION.md"
