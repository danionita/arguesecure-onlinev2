[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sized for a small, mostly-idle instance rather than a busy host.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
