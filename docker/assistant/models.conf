# The assistant's model catalogue (PLAN-2.6.md D52, D53).
#
# The one list of presets. `assistant.sh` reads it to install and to start a
# model; App\Domain\Assistant\ModelCatalog reads it to tell an admin which
# model is running. Two readers, one file, so the installer and the admin
# page cannot disagree about what a preset is.
#
# One preset per line, whitespace-separated, the label last (it may contain
# spaces):
#
#   name  file  repo  revision  bytes  sha256  memory_gib  cache_mib  label
#
# - repo and revision pin the download to one publisher commit (D18): `main`
#   moves, a commit does not.
# - bytes and sha256 are checked before a download gets its real name, and
#   bytes again every time the runtime starts. A truncated GGUF once
#   downloaded with exit status 0 (docs/spikes/2.3-inference.md).
# - cache_mib bounds the runtime's host-RAM prompt cache (--cache-ram), which
#   is what keeps the help pages cached while a suggestion or a summary uses
#   the only slot (D56). Per preset, because a cached prompt's size is: on
#   `small` nothing was ever evicted under 2 GiB; on `large` a single help or
#   summary entry is up to 1.13 GiB, 2 GiB held about two of them, and the
#   help pages were evicted after a summary (W96,
#   tools/spike/assistant/results/verify-logs/unraid-large.log).
# - memory_gib is the RAM to budget, measured on the deployment host
#   (docs/spikes/2.6-models.md): weights, a 12,288-token context, compute
#   buffers and the prompt cache at its bound. The installer refuses a host
#   with less, unless forced.
#
# Changing a line here changes what `install` downloads. Measure first: the
# figures in docs/spikes/2.6-models.md, and the red-team record in
# tests/fixtures/assistant/injections.json, are what justify these two.

small  gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf      unsloth/gemma-4-E4B-it-qat-GGUF      8c5a9e4fd5482e2be20fe0bf013b4c262a8f4265  4215695776   df0fd4ee07072c607c29a0a1cb4f98918426cca12f45a2776bdd6ee6d09a4de3  6   2048  Gemma 4 E4B (4-bit, quantization-aware)
large  gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf  unsloth/gemma-4-26B-A4B-it-qat-GGUF  7b92b5b28818151e8669af2e45e88d6086f490dd  14249047104  a7c5bc715f5ff8e99a3e8901ce7d2b42b402c669bf24f7c5250747633d0f5891  28  4096  Gemma 4 26B-A4B (4-bit, quantization-aware, mixture of experts)
