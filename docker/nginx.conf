# W24 (performance): brotli compresses smaller and faster than gzip for text
# assets, but the module ships as a separate Alpine package
# (nginx-mod-http-brotli) that must be loaded before the `events` block. It
# is installed in the Dockerfile; `load_module` is skippable at runtime via
# an environment check, but nginx has no such thing, so instead the module
# file's presence is what gates it: if the package failed to install, this
# directive would fail nginx at startup rather than silently degrading, so
# the Dockerfile step that installs it is a hard `RUN apk add` (fails the
# image build, not the container start, if the package is ever unavailable
# for a given Alpine release — see the Dockerfile comment by that line).
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /run/nginx.pid;
user www-data;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # gzip — always available (core nginx module), compresses the text
    # responses that dominate this app: Inertia's JSON page payloads, the
    # built JS/CSS in public/build, and HTML. Images/fonts are already
    # compressed formats and are excluded to avoid wasted CPU.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # brotli — same content types as gzip above; typically 15-20% smaller
    # than gzip at equivalent CPU cost for text. `gzip` above stays enabled
    # as the fallback for the (now rare) client that sends
    # `Accept-Encoding: gzip` without `br`.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 512;
    brotli_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # W111: a share link carries its read token in the path (/s/{token}), and
    # `$request` would write it, live, to the access log and so to the
    # container's stdout and the reverse proxy's log. The format logs a
    # request line rebuilt from `$request_uri` with that segment masked
    # instead. The map is anchored to the path's start, so only the
    # redemption route is touched; the query string of other paths is kept.
    # Extra leading slashes and an encoded `s` are matched too, because the
    # raw URI is what is logged and what php-fpm is given.
    # The Referer is safe to log as is: the app redirects away from the token
    # URL before any page is rendered, so no page carries it.
    map $request_uri $log_uri {
        default "$request_uri";
        ~^/+(?:s|%73)/[^?]* "/s/[redacted]";
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $log_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Trust the private-range reverse proxy for the real client IP, for the
        # access log. Scheme trust is Laravel's TrustProxies, not here, and
        # php-fpm must therefore see the proxy's address, not the client's:
        # see the REMOTE_ADDR line in the PHP location below.
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Reverb is not published to the host; nginx is the only way in, so
        # websockets inherit the app's TLS, hostname and origin.
        #
        # W27: this said `127.0.0.1:8080`, which is inside *this* container —
        # supervisord here runs php-fpm and nginx only. Reverb is its own
        # compose service (`php artisan reverb:start`), so the upstream is the
        # service name on the compose network, exactly as DB_HOST=db and
        # REDIS_HOST=redis are. It was never noticed because no browser ever
        # dialled the socket at all: the bundle shipped without an app key.
        #
        # `resolver` plus a variable upstream is deliberate. nginx resolves a
        # literal upstream name once, at startup, and refuses to start if it
        # does not resolve — which it would not, on any boot where `reverb`
        # comes up after `app`. Through a variable the lookup is deferred to
        # the first request and retried, so the two containers may start in
        # either order. 127.0.0.11 is Docker's embedded DNS server.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location /app {
            set $reverb_upstream "reverb:8080";
            proxy_pass http://$reverb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;

            # W25: without this the tree editor answers 502 Bad Gateway.
            #
            # nginx must fit an upstream's ENTIRE response header block into a
            # single `fastcgi_buffer_size`, which defaults to one memory page
            # — 4 KB. Laravel's Vite integration emits a `Link:` header
            # preloading every built chunk the page component needs, and on
            # Pages/Assessment/Show.vue (the deepest component tree in the
            # app) that header alone is ~2.7 KB. Add the CSP, the two
            # Set-Cookie headers and the ordinary rest and the block lands at
            # roughly 4.4 KB: just over the line. nginx then refuses the
            # response with "upstream sent too big header" and returns 502.
            #
            # Two things kept this invisible until the end-to-end scenarios
            # ran. It affects the deployed stack only — `php artisan serve`
            # and the Pest suite never involve nginx — and it sits so close to
            # the 4 KB boundary that it comes and goes with the session
            # cookie's size and with whatever hashed filenames a given build
            # produces. It is therefore a flaky 502 on the application's
            # primary screen, which is worse than a reliable one.
            #
            # 32k is chosen as comfortably beyond any plausible growth in the
            # preload list rather than a tight fit, precisely because the tight
            # fit is what failed. `fastcgi_buffers` is raised alongside it
            # because nginx requires the body buffers to be at least the size
            # of the header buffer.
            #
            # tests/e2e/04-full-page-load.spec.ts is the regression guard: it
            # loads the editor by URL rather than by in-app navigation, which
            # is the distinction that matters here.
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            include fastcgi_params;
            # The proxy's own address, not the client's that real_ip put in
            # $remote_addr. TrustProxies trusts X-Forwarded-Proto only from a
            # private REMOTE_ADDR, so handing it a visitor's public IP made it
            # ignore SWAG's https and build http:// asset URLs, which the
            # browser blocks as mixed content. Every test client was on a
            # private address, so only a real visitor from the internet saw it.
            # Laravel still resolves the visitor's IP from X-Forwarded-For.
            fastcgi_param REMOTE_ADDR $realip_remote_addr;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
